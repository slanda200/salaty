<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Košík – Saláty od Kašši</title>
  <link rel="stylesheet" href="style.css?v=3" />
  <script src="theme.js"></script>
</head>
<body class="cart">

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">Saláty od Kašši</a>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" title="Přepnout tmavý režim" aria-label="Přepnout tmavý režim">☀</button>
      <a href="cart.html" class="cart-btn">
        🛒 Košík <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </div>
</nav>

<main>
<div style="max-width:600px;margin:0 auto;padding:40px 20px">

  <section>
    <h2>Košík</h2>
    <div id="cart-empty" style="display:none" class="empty-state">
      Košík je prázdný. <a href="index.html">Zpět na výběr</a>
    </div>
    <div id="cart-content">
      <div class="cart-box">
        <div class="cart-items" id="cart-items"></div>
        <hr class="cart-divider" />
        <div class="cart-summary">
          <div class="cart-row"><span>Doprava</span><span id="cart-delivery">0 Kč</span></div>
          <div class="cart-row cart-total"><span>Celkem</span><span id="cart-total">0 Kč</span></div>
        </div>
      </div>
    </div>
  </section>

  <div id="orders-closed-card" style="display:none;text-align:center;padding:32px 24px;background:var(--gray-100);border-radius:var(--radius);margin-bottom:24px">
    <div style="font-size:2.5rem;margin-bottom:12px">🚫</div>
    <p id="orders-closed-msg" style="font-size:1.05rem;font-weight:600;color:var(--gray-800);margin-bottom:16px"></p>
    <a href="index.html" style="display:inline-block;color:var(--green);font-weight:700">← Zpět na výběr</a>
  </div>

  <section id="order-section">
    <h2>Kontakt</h2>
    <form class="order-form" id="order-form" onsubmit="submitOrder(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">Jméno *</label>
          <input type="text" id="first_name" required placeholder="Jana" />
        </div>
        <div class="form-group">
          <label for="last_name">Příjmení *</label>
          <input type="text" id="last_name" required placeholder="Nováková" />
        </div>
      </div>
      <div class="form-group">
        <label for="phone">Telefon *</label>
        <input type="tel" id="phone" required placeholder="+420 777 123 456" />
      </div>
      <div class="form-group">
        <label for="note">Poznámka</label>
        <textarea id="note" placeholder="Alergeny, speciální přání…"></textarea>
      </div>
      <div id="order-error" style="display:none;color:#c0392b;background:#fdecea;border-radius:8px;padding:12px 16px;font-size:.95rem;margin-bottom:4px"></div>
      <button type="submit" class="submit-btn" id="submit-btn">Odeslat objednávku</button>
    </form>
  </section>

  <section id="confirmation" style="display:none">
    <div style="max-width:600px;margin:0 auto;padding:40px 20px">
      <div style="background:var(--green-light);border:2px solid var(--green);border-radius:var(--radius);padding:32px;text-align:center">
        <h3 style="color:var(--green);font-size:1.4rem;margin-bottom:8px">✅ Objednávka odeslána!</h3>
        <p>Táta se ozve na váš telefon s potvrzením dovozu.</p>
        <a href="index.html" style="display:inline-block;margin-top:16px;color:var(--green);font-weight:700">← Zpět na výběr</a>
      </div>
    </div>
  </section>

</div>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const DELIVERY_PER_ITEM = 10;

function getCart() {
  try { return JSON.parse(localStorage.getItem("cart") || "[]"); } catch { return []; }
}
function saveCart(cart) { localStorage.setItem("cart", JSON.stringify(cart)); }

function renderCart() {
  const cart = getCart();
  const total = cart.reduce((s, i) => s + i.quantity, 0);
  document.getElementById("cart-count").textContent = total;

  if (!cart.length) {
    document.getElementById("cart-empty").style.display = "block";
    document.getElementById("cart-content").style.display = "none";
    document.getElementById("order-section").style.display = "none";
    return;
  }

  document.getElementById("cart-empty").style.display = "none";
  document.getElementById("cart-content").style.display = "block";
  document.getElementById("order-section").style.display = "block";

  let subtotal = 0;
  let totalQty = 0;
  document.getElementById("cart-items").innerHTML = cart.map((item, idx) => {
    const line = item.price * item.quantity;
    subtotal += line;
    totalQty += item.quantity;
    return `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${item.productName}${item.variant ? ` <span style="color:var(--gray-600);font-weight:400;font-size:.85rem">(${item.variant})</span>` : ""}</div>
          <div class="cart-item-detail" style="display:flex;align-items:center;gap:10px;margin-top:6px">
            <button class="qty-btn" style="width:26px;height:26px;font-size:1rem" onclick="changeQty(${idx}, -1)">−</button>
            <span style="font-weight:700">${item.quantity}</span>
            <button class="qty-btn" style="width:26px;height:26px;font-size:1rem" onclick="changeQty(${idx}, 1)">+</button>
            <span style="color:var(--gray-400)">× ${item.price} Kč</span>
            <button onclick="removeItem(${idx})" style="margin-left:auto;background:none;color:var(--gray-400);font-size:1.1rem;padding:2px 6px;border-radius:4px" title="Odebrat">✕</button>
          </div>
        </div>
        <strong style="white-space:nowrap">${line} Kč</strong>
      </div>
    `;
  }).join("");

  const delivery = totalQty * DELIVERY_PER_ITEM;
  document.getElementById("cart-delivery").textContent = `${delivery} Kč`;
  document.getElementById("cart-total").textContent = `${subtotal + delivery} Kč`;
}

function changeQty(idx, delta) {
  const cart = getCart();
  cart[idx].quantity = Math.max(1, cart[idx].quantity + delta);
  saveCart(cart);
  renderCart();
}

function removeItem(idx) {
  const cart = getCart();
  cart.splice(idx, 1);
  saveCart(cart);
  renderCart();
}

async function submitOrder(e) {
  e.preventDefault();
  const cart = getCart();
  if (!cart.length) return;

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Odesílám…";

  // Race condition check — objednávky mohly být mezitím vypnuty
  const { data: settings } = await db.from("shop_settings").select("orders_enabled,closed_message").eq("id", 1).single();
  if (settings && settings.orders_enabled === false) {
    btn.disabled = false;
    btn.textContent = "Odeslat objednávku";
    showOrdersClosed(settings.closed_message);
    return;
  }

  // Zjisti IP
  let userIp = null;
  try {
    const res = await fetch("https://api.ipify.org?format=json");
    const json = await res.json();
    userIp = json.ip;
  } catch { /* pokračuj bez IP */ }

  // Zkontroluj blokaci (přes bezpečnou funkci — veřejnost nesmí číst celý seznam blokovaných IP)
  if (userIp) {
    const { data: isBlocked } = await db.rpc("is_ip_blocked", { check_ip: userIp });
    if (isBlocked) {
      document.getElementById("submit-btn").textContent = "Odeslat objednávku";
      btn.disabled = false;
      const errEl = document.getElementById("order-error");
      errEl.textContent = "Omlouváme se, vaše objednávka nemůže být zpracována.";
      errEl.style.display = "block";
      return;
    }
  }

  const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const totalQty = cart.reduce((s, i) => s + i.quantity, 0);
  const delivery = totalQty * DELIVERY_PER_ITEM;
  const items = cart.map(i => ({
    productId: i.productId,
    name: i.productName,
    variant: i.variant,
    qty: i.quantity,
    price: i.price,
  }));

  const { data: newOrder, error } = await db.from("orders").insert({
    first_name:  document.getElementById("first_name").value.trim(),
    last_name:   document.getElementById("last_name").value.trim(),
    phone:       document.getElementById("phone").value.trim(),
    note:        document.getElementById("note").value.trim(),
    items,
    total_price: subtotal + delivery,
    status:      "new",
  }).select().single();

  if (error) {
    alert("Chyba při odesílání: " + error.message);
    btn.disabled = false;
    btn.textContent = "Odeslat objednávku";
    return;
  }

  // Ulož IP
  if (userIp && newOrder) {
    await db.from("order_ips").insert({
      order_id:   newOrder.id,
      ip:         userIp,
      user_agent: navigator.userAgent,
    });
  }

  saveCart([]);
  document.getElementById("cart-content").style.display = "none";
  document.getElementById("order-section").style.display = "none";
  document.getElementById("confirmation").style.display = "block";
  document.getElementById("cart-count").textContent = "0";
}

function showOrdersClosed(message) {
  document.getElementById("orders-closed-msg").textContent = message || "Objednávky aktuálně nepřijímáme.";
  document.getElementById("orders-closed-card").style.display = "";
  document.getElementById("order-section").style.display = "none";
}

async function checkShopOpen() {
  const { data } = await db.from("shop_settings").select("orders_enabled,closed_message").eq("id", 1).single();
  if (data && data.orders_enabled === false) {
    showOrdersClosed(data.closed_message);
  }
}

renderCart();
checkShopOpen();
</script>
</body>
</html>
